<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Parents &amp; Athletes · West Delaware Girls Wrestling</title>
<meta name="description" content="Heja team app code, printable season calendar and info for West Delaware girls wrestling families.">
<link rel="icon" href="favicon.png"><link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@700;800&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css">
<style>
.hj{border:2px solid var(--k);display:flex;align-items:center;gap:22px;padding:18px 22px;border-left:8px solid var(--o);border-radius:6px}
.hj .ic{width:96px;height:96px;border-radius:22px;flex:none;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.hj h2{margin:0;font:700 24px var(--f-head);text-transform:uppercase}.hj h2 span{color:var(--o)}
.hj p{margin:6px 0 10px;font-size:15px;color:#333}
.cd{display:inline-flex;align-items:baseline;gap:10px;background:var(--k);color:#fff;padding:6px 14px;border-radius:4px;white-space:nowrap;cursor:pointer;border:0}
.cd small{font:700 14px var(--f-cond);letter-spacing:2px;color:var(--g)}
.cd b{font:800 40px/1.1 var(--f-head);letter-spacing:3px;color:var(--o)}
.cd em{font:600 12px var(--f-cond);color:#bbb;font-style:normal;letter-spacing:1px}
.bd{display:flex;gap:12px;align-items:center;margin-top:12px;flex-wrap:wrap}.bd img{height:46px;width:auto;display:block}
.who{display:inline-block;background:var(--o);color:#fff;font:700 12px var(--f-cond);letter-spacing:1.5px;text-transform:uppercase;padding:2px 8px;border-radius:2px;margin-bottom:6px}
@media(max-width:640px){.hj{flex-direction:column;text-align:center;padding:16px 12px}.bd{justify-content:center}.cd b{font-size:32px}</style>
</head>
<body>
<header class="top" id="top"></header>
<div class="tk" id="tk"></div>
<div class="hdr"><div class="wrap"><h1>Parents &amp; Athletes</h1></div></div>

<main class="wrap" style="padding-top:28px">
  <div class="hj"><img class="ic" src="img/heja-icon.png" alt="Heja app icon">
    <div><div class="who">High School Team</div><h2>Team App: <span>Heja</span></h2>
      <p>We use Heja for all team communication: schedule updates, announcements, and messages.</p>
      <button class="cd" id="code" title="Tap to copy"><small>TEAM CODE</small><b>VY-431905</b><em id="cp">TAP TO COPY</em></button>
      <div class="bd">
        <a href="https://apps.apple.com/us/app/heja-simple-communication/id1157335714" target="_blank" rel="noopener"><img src="img/app-store.svg" alt="Download on the App Store"></a>
        <a href="https://play.google.com/store/apps/details?id=com.heja.app" target="_blank" rel="noopener"><img src="img/google-play.png" alt="Get it on Google Play"></a>
      </div>
    </div>
  </div>

</main>
<footer class="foot" id="foot"></footer>

<script src="js/site.js"></script>
<script>
document.getElementById('code').onclick=()=>{try{navigator.clipboard.writeText('VY-431905').then(()=>{document.getElementById('cp').textContent='COPIED!'})}catch(e){}};
</script>
</body>
</html>
